.search:before{content:'⌕';font-size:28px;top:7px;color:#77728f}
button{border-radius:13px;background:linear-gradient(135deg,#6b5af7,#5543df);box-shadow:0 5px 13px #6554f426;transition:transform .16s,box-shadow .16s,filter .16s}
button:hover{filter:brightness(1.02);transform:translateY(-1px);box-shadow:0 8px 18px #6554f42b}
button:active{transform:translateY(0)}
button.secondary,.cat{background:#fff;color:#35334c;border:1px solid #e6e4f1;box-shadow:none}

.cat.active{background:#1b1932;color:white;border-color:#1b1932}
.section-head{margin:7px 0 18px}

.photo img{transition:transform .3s}.card:hover .photo img{transform:scale(1.035)}

.meta{font-size:11px;color:#85869a}
.badge{background:#f0edff;color:#6554f4;font-weight:750}

.notif-icon{background:linear-gradient(135deg,#ece8ff,#ffeaf2);color:#6554f4}
.listrow{border-color:#eeedf5;border-radius:15px}
.thumb{border-radius:12px;background:linear-gradient(135deg,#eeebff,#fff0f5)}

button.secondary,.cat{background:transparent;color:inherit;border:1px solid #d4c7ba;box-shadow:none}
.top button.secondary{color:#f8f1e8;border-color:#55475f;background:#2b2333}

:root{--ink:#211a29;--brand:#211a29;--brand2:#e8ffad;--line:#dfd3c7;--bg:#f0e8dc;--muted:#817582;--good:#3e7026;--danger:#c43f56}
html{scroll-behavior:smooth}body{background-color:#f0e8dc;background-image:radial-gradient(#b5a59736 .7px,transparent .7px);background-size:8px 8px}
.top{background:#211a29f5;border-bottom:1px solid #55475f;backdrop-filter:blur(16px);box-shadow:0 8px 28px #211a2912}.toprow{min-height:76px}.logo{color:#fffaf4;display:flex;align-items:center;gap:9px;letter-spacing:-1.7px}.logo .logo-mark{display:inline-flex;align-items:center;justify-content:center;width:37px;height:37px;border-radius:12px;background:#c9ff52;color:#211a29;font-size:25px;letter-spacing:-2px;box-shadow:0 0 0 5px #c9ff5214}.logo-period{color:#c9ff52!important;margin-left:-8px}.search input{background:#342b3d;border:1px solid #51435c;color:#fffaf4;border-radius:13px;padding:13px 15px 13px 43px;transition:border-color .2s,box-shadow .2s}.search input::placeholder{color:#b8acbc}.search input:focus{border-color:#c9ff52;box-shadow:0 0 0 4px #c9ff521a}.search:before{color:#c9ff52;top:6px}.nav button{transition:transform .18s,background .18s}.sell-button{box-shadow:0 5px 0 #91bd30,0 10px 24px #c9ff5220;font-weight:900}.sell-button:hover{transform:translateY(-2px);box-shadow:0 7px 0 #91bd30,0 15px 30px #c9ff5233}

.cats{position:relative;padding-top:17px;gap:9px}.cats:before{content:'CURATED SECOND-HAND';position:absolute;top:0;left:2px;font-size:8px;font-weight:900;letter-spacing:2.1px;color:#887b89}.cat{transition:all .2s ease;box-shadow:0 2px 0 #211a2906}.cat:hover{border-color:#211a29;transform:translateY(-2px)}.cat.active{box-shadow:0 4px 0 #c9ff52}

.grid{gap:17px}.card{position:relative;border-radius:11px;box-shadow:0 3px 0 #211a2908,0 9px 25px #211a2908;overflow:hidden}.card:after{content:'';position:absolute;inset:0;border:1px solid #ffffff00;border-radius:inherit;pointer-events:none;transition:border-color .2s}.card:hover:after{border-color:#c9ff52}.card:hover{transform:translateY(-6px) rotate(0deg);box-shadow:0 7px 0 #c9ff52,0 22px 35px #211a2920}.photo{background:linear-gradient(135deg,#e8ded1,#d3c4b5)}.photo img{transition:transform .45s cubic-bezier(.2,.7,.2,1);will-change:transform}.card:hover .photo img{transform:scale(1.055)}.heart{backdrop-filter:blur(9px);transition:transform .18s,background .18s}.heart:hover{transform:scale(1.08)}.card-body{background:linear-gradient(180deg,#fbf7f0,#f7f0e7)}.price{font-variant-numeric:tabular-nums}.item-title{line-height:1.4}.meta{letter-spacing:.2px}.badge{font-weight:850;letter-spacing:.3px}
.panel,.modal{box-shadow:0 18px 50px #211a290c}.panel{border-radius:13px}.field input:focus,.field textarea:focus,.field select:focus{border-color:#8caf3e;box-shadow:0 0 0 4px #c9ff5230}.page{animation:clovyIn .35s ease both}.modalback{backdrop-filter:blur(7px);background:#211a29a8}.modal{box-shadow:0 30px 100px #100b16a8}.footer{margin-top:20px;position:relative;overflow:hidden}.footer:before{content:'CLOVY';position:absolute;right:5%;bottom:-42px;font-size:115px;font-weight:950;letter-spacing:-9px;color:#ffffff08;pointer-events:none}.footer .wrap{position:relative;z-index:1}.toast{box-shadow:0 15px 40px #211a2940}
@keyframes clovyIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

<body>
<div class="top"><div class="wrap toprow">
  <div class="logo" onclick="go('home')"><span class="logo-mark">c.</span> CLOVY<span class="logo-period">/</span></div>
  <div class="search"><input id="search" placeholder="Szukaj perełek, marek, rozmiarów..." oninput="renderHome()"></div>
  <div class="nav">
    <button class="navicon secondary small optional" aria-label="Polubione" title="Polubione" onclick="go('favorites')"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"/></svg><span class="navlabel">Zapisane</span></button>
    <button class="navicon secondary small optional" aria-label="Wiadomości" title="Wiadomości" onclick="go('messages')"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8A8.5 8.5 0 0 1 8.7 4a8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8Z"/></svg><span class="navlabel">Wiadomości</span></button>
    <button class="navicon secondary small" id="notifButton" aria-label="Powiadomienia" title="Powiadomienia" onclick="toggleNotifications()"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg><span id="notifCount">0</span></button>
    <button class="sell-button small" onclick="go('add')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg><span>Wystaw</span></button>
    <div class="userpill" id="userPill" onclick="go('profile')" style="cursor:pointer"><span class="avatar" id="topAvatar">?</span><span class="username" id="topName">Gość</span></div>
  </div>
</div></div>
<main id="app"></main>
<div class="footer"><div class="wrap labelrow"><span>© CLOVY — lokalne demo marketplace'u</span><span>Wersja testowa • bez prawdziwych płatności</span></div></div>
<div id="modalRoot"></div><div id="notificationRoot"></div><div id="toast" class="toast hidden"></div>
<script>
const KEY='clovy_marketplace_demo_v1';
const CHANNEL='clovy_demo_sync_v1';
const EMOJIS={Ubrania:'👕',Buty:'👟',Dodatki:'👜',Inne:'✨'};
let db, current=null, page='home', activeCat='Wszystko', activeProfileTab='listings', activeChat=null, toastTimer;
const channel=('BroadcastChannel' in window)?new BroadcastChannel(CHANNEL):null;

function ico(name,size=18){
 const p={
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
  heart:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"/>',
  chat:'<path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8A8.5 8.5 0 0 1 8.7 4a8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8Z"/>',
  bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M5 21a7 7 0 0 1 14 0"/>',
  bag:'<path d="M5 8h14l1 13H4L5 8Z"/><path d="M9 8a3 3 0 0 1 6 0"/>',
  arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  filter:'<path d="M4 7h16M7 12h10m-7 5h4"/><circle cx="8" cy="7" r="1.5"/><circle cx="15" cy="12" r="1.5"/>',
  close:'<path d="m18 6-12 12M6 6l12 12"/>',
  spark:'<path d="m12 3 1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2L12 3Z"/><path d="m19 14 1 2.5 2.5 1-2.5 1L19 21l-1-2.5-2.5-1 2.5-1L19 14Z"/>'
 };
 return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p[name]||p.spark}</svg>`;
}

function seed(){return {users:[],items:[],likes:[],messages:[],orders:[],notifications:[],demoSeeded:false,createdAt:Date.now()}}
function load(){try{db=JSON.parse(localStorage.getItem(KEY))||seed()}catch(e){db=seed()} if(!db.users)db.users=[];if(!db.items)db.items=[];if(!db.likes)db.likes=[];if(!db.messages)db.messages=[];if(!db.orders)db.orders=[];if(!db.notifications)db.notifications=[];if(typeof db.demoSeeded!=='boolean')db.demoSeeded=false; }
function save(){localStorage.setItem(KEY,JSON.stringify(db));if(channel)channel.postMessage({type:'update',at:Date.now()});}
function refresh(){load();updateHeader();if(page==='home')renderHome();else if(page==='profile')renderProfile();else if(page==='favorites')renderFavorites();else if(page==='messages')renderMessages();else if(page==='myitems')renderMyItems();else if(page==='add')renderAdd();else if(page==='auth')renderAuth();else if(page==='orders')renderOrders();}
window.addEventListener('storage',e=>{if(e.key===KEY)refresh()});
if(channel)channel.onmessage=()=>refresh();
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return new Intl.NumberFormat('pl-PL',{style:'currency',currency:'PLN',maximumFractionDigits:2}).format(Number(n)||0)}
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4)}
function user(){return db.users.find(u=>u.id===current)||null}
function initials(name){return (name||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()}
function updateHeader(){let u=user();document.getElementById('topName').textContent=u?u.name:'Gość';document.getElementById('topAvatar').textContent=u?initials(u.name):'?';let unread=u?db.notifications.filter(n=>n.userId===current&&!n.read).length:0;let nc=document.getElementById('notifCount');if(nc)nc.textContent=unread>9?'9+':String(unread);let nb=document.getElementById('notifButton');if(nb)nb.title=u?'Powiadomienia':'Zaloguj się, aby zobaczyć powiadomienia';}
function say(s){let t=document.getElementById('toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.add('hidden'),2600)}
function go(p){page=p;document.getElementById('modalRoot').innerHTML='';if(p==='home')renderHome();else if(p==='auth')renderAuth();else if(p==='add')renderAdd();else if(p==='profile')renderProfile();else if(p==='favorites')renderFavorites();else if(p==='messages')renderMessages();else if(p==='myitems')renderMyItems();else if(p==='orders')renderOrders();window.scrollTo(0,0)}
function requireUser(){if(!user()){say('Najpierw zaloguj się lub utwórz konto.');go('auth');return false}return true}
function imageMarkup(item,cls=''){if(item.demo&&!item.image)return `<div class="${cls} emoji">${item.emoji||EMOJIS[item.category]||'✨'}</div>`;if(item.image)return `<img loading="lazy" class="${cls}" src="${esc(item.image)}" alt="${esc(item.title)}" onerror="this.outerHTML='<div class=\\'${cls} emoji\\'>${item.emoji||EMOJIS[item.category]||'✳'}</div>'">`;return `<div class="${cls} emoji">${EMOJIS[item.category]||'✨'}</div>`}

function notify(userId,type,title,body,itemId=''){if(!userId)return;db.notifications.unshift({id:uid(),userId,type,title,body,itemId,createdAt:Date.now(),read:false});db.notifications=db.notifications.slice(0,500)}
function seedDemoListings(){
  load();
  const sellerNames=['mila.vintage','ola_style','kuba.closet','ania_wardrobe','streetfinds','lena.shop','szafa_oli','moda_second','urbancloset','kasia_vibes','retro_mateusz','closet.pl','fashionbyiza','dailyfits','vintagefox','sneakerhead_pl','slowfashion','monika_look','wearagain','szafa_klasy'];
  const demoUsers=[];
  sellerNames.forEach((name,idx)=>{
    let u=db.users.find(x=>x.name.toLowerCase()===name.toLowerCase());
    if(!u){u={id:'demo_user_'+idx,name,pass:'demo-only',joinedAt:Date.now()-((idx+2)*86400000),bio:'Lubię modę z drugiego obiegu i wyszukuję wyjątkowe perełki ✨',avatar:'',demo:true};db.users.push(u)}
    demoUsers.push(u);
  });
  const first=['Vintage','Klasyczna','Oversize','Minimalistyczna','Sportowa','Retro','Elegancka','Bawełniana','Lniana','Streetwear','Y2K','Premium','Basic','Skater','Old-school'];
  const products=[
    {cat:'Ubrania',names:['bluza','koszulka','kurtka','sukienka','sweter','spodnie','marynarka','spódnica','top','jeansy','kardigan','płaszcz','body','kamizelka']},
    {cat:'Buty',names:['sneakersy','botki','trampki','buty sportowe','mokasyny','baleriny','kozaki','sandały']},
    {cat:'Dodatki',names:['torebka','plecak','czapka','pasek','okulary','szalik','portfel','biżuteria','nerka','czapka z daszkiem']}
  ];
  const brands=['Nike','Adidas','Zara','H&M','Reserved','New Balance','Puma','Levi’s','Mango','Converse','Reebok','Pull&Bear','Bershka','Vans','No brand','COS','Uniqlo','Massimo Dutti','Carhartt','The North Face'];
  const colors=['czarna','biała','beżowa','szara','granatowa','zielona','brązowa','różowa','bordowa','niebieska','kremowa','oliwkowa'];
  const sizes=['XS','S','M','L','XL','38','39','40','41','42','Uniwersalny','36','37','43','44'];
  const conditions=['Bardzo dobry','Dobry','Nowy bez metki','Nowy z metką'];
  const photoSets={
    Ubrania:[
      'photo-1521572163474-6864f9cf17ab','photo-1551488831-00ddcb6c6bd3','photo-1523381210434-271e8be1f52b','photo-1490481651871-ab68de25d43d',
      'photo-1551232864-3be4559e9e6f','photo-1434389677669-e08b4cac3105','photo-1483985988355-763728e1935b','photo-1515886657613-9f3515b0c78f',
      'photo-1529139574466-a303027c1d8b','photo-1485230895905-ec40ba36b9bc','photo-1543076447-215ad9ba6923','photo-1496747611176-843222e1e57c'
    ],
    Buty:[
      'photo-1542291026-7eec264c27ff','photo-1543163521-1bf539c55dd2','photo-1460353581641-37baddab0fa2','photo-1495555961986-6d4c1ecb7be3',
      'photo-1549298916-b41d501d3772','photo-1552346154-21d32810aba3','photo-1600185365483-26d7a4cc7519','photo-1542291026-7eec264c27ff'
    ],
    Dodatki:[
      'photo-1548036328-c9fa89d128fa','photo-1584917865442-de89df76afd3','photo-1553062407-98eeb64c6a62','photo-1526170375885-4d8ecf77b99f',
      'photo-1509319117193-57bab727e09d','photo-1576053139778-7e32f2ae3cfd','photo-1612902456551-333ac5afa26d','photo-1590874103328-eac38a683ce7'
    ]
  };
  const photoFor=(cat,i)=>`https://images.unsplash.com/${photoSets[cat][i%photoSets[cat].length]}?auto=format&fit=crop&w=700&q=82`;
  const existing=new Set(db.items.filter(i=>i.demo).map(i=>i.id));
  for(let i=0;i<250;i++){
    const id='demo_item_'+i;
    if(existing.has(id)){
      const old=db.items.find(x=>x.id===id);
      if(old){const cat=old.category==='Buty'?'Buty':old.category==='Dodatki'?'Dodatki':'Ubrania';old.image=photoFor(cat,i);old.demo=true;old.emoji=cat==='Buty'?'👟':cat==='Dodatki'?'👜':'👕';}
      continue;
    }
    const group=products[i%products.length], noun=group.names[(i*7+Math.floor(i/3))%group.names.length];
    const brand=brands[(i*11+3)%brands.length], prefix=first[(i*5+Math.floor(i/2))%first.length];
    const category=group.cat, seller=demoUsers[i%demoUsers.length];
    const rawPrice=category==='Buty'?69+((i*37)%280):category==='Dodatki'?19+((i*17)%170):15+((i*23)%220);
    const price=Math.round((rawPrice+(i%4)*0.99)*100)/100;
    const emoji=category==='Buty'?'👟':category==='Dodatki'?'👜':'👕';
    db.items.push({id,sellerId:seller.id,title:`${prefix} ${noun} ${i%4===0?brand:''}`.trim(),price,category,brand,size:sizes[(i*7)%sizes.length],condition:conditions[(i*3)%conditions.length],color:colors[(i*5)%colors.length],description:`Fikcyjne ogłoszenie demonstracyjne CLOVY. Zdjęcie jest zdjęciem poglądowym z internetu, a oferta nie jest prawdziwą ofertą sprzedaży. ${i%2?'Stan przykładowy — dane służą do testowania interfejsu.':'To przykładowy wpis katalogowy. Nie kupuj tego produktu.'}`,image:photoFor(category,i),status:'active',createdAt:Date.now()-(i*63000),demo:true,emoji});
  }
  // Give older demo entries a photo as well, and never replace user-created listings.
  db.items.filter(i=>i.demo).forEach((item,idx)=>{
    if(!item.image || item.image.startsWith('data:')){
      const cat=item.category==='Buty'?'Buty':item.category==='Dodatki'?'Dodatki':'Ubrania';
      item.image=photoFor(cat,idx);
    }
  });
  db.demoSeeded=true;save();
}
function toggleNotifications(){
  if(!user()){say('Zaloguj się, aby zobaczyć powiadomienia.');go('auth');return}
  const root=document.getElementById('notificationRoot');
  if(root.innerHTML){root.innerHTML='';return}
  const list=db.notifications.filter(n=>n.userId===current).slice(0,40);
  root.innerHTML=`<div class="notif-pop"><div class="labelrow"><strong>Powiadomienia</strong><button class="ghost small" onclick="markAllRead()">Oznacz jako przeczytane</button></div><div style="margin-top:8px">${list.length?list.map(n=>`<div class="notif-item ${n.read?'':'unread'}"><div class="notif-icon">${n.type==='like'?'♥':n.type==='message'?'✉':n.type==='order'?'📦':'✦'}</div><div class="grow"><strong>${esc(n.title)}</strong><p>${esc(n.body)}</p><p>${new Date(n.createdAt).toLocaleString('pl-PL')}</p>${n.itemId?`<button class="secondary small" onclick="document.getElementById('notificationRoot').innerHTML='';detail('${n.itemId}')">Zobacz</button>`:''}</div></div>`).join(''):'<div class="empty" style="padding:24px 8px">Brak powiadomień. Gdy ktoś polubi produkt lub napisze wiadomość, pojawią się tutaj.</div>'}</div></div>`;
}
function markAllRead(){if(!user())return;db.notifications.forEach(n=>{if(n.userId===current)n.read=true});save();document.getElementById('notificationRoot').innerHTML='';toggleNotifications();updateHeader()}

function filteredItems(){let q=(document.getElementById('search')?.value||'').trim().toLowerCase();return db.items.filter(i=>i.status==='active'&&(activeCat==='Wszystko'||i.category===activeCat)&&(!q||(i.title+' '+i.description+' '+i.brand+' '+i.size+' '+i.category).toLowerCase().includes(q))).sort((a,b)=>b.createdAt-a.createdAt)}
function isLiked(id){return !!(current&&db.likes.some(l=>l.userId===current&&l.itemId===id))}
function card(i){let liked=isLiked(i.id),seller=db.users.find(u=>u.id===i.sellerId);return `<article class="card"><div class="photo" onclick="detail('${i.id}')">${imageMarkup(i)}<button class="heart ${liked?'on':''}" aria-label="Polub" onclick="event.stopPropagation();toggleLike('${i.id}')">${liked?'♥':'♡'}</button></div><div class="card-body"><div class="price">${money(i.price)}</div><div class="item-title" title="${esc(i.title)}">${esc(i.title)}</div><div class="meta"><span>${esc(i.size||i.category)}</span><span>${esc(seller?.name||'Użytkownik')}</span></div></div></article>`}
function renderHome(){page='home';updateHeader();let items=filteredItems();let cats=['Wszystko','Ubrania','Buty','Dodatki','Inne'];document.getElementById('app').innerHTML=`<div class="wrap"><section class="hero ${current?'hidden':''}"><div class="hero-inner"><div><div class="eyebrow"><span class="eyebrow-dot"></span> SECOND HAND, FIRST CHOICE</div><h1>Rzeczy z historią.<br><em>Styl po Twojemu.</em></h1><p>Ubrania, które zasługują na drugi rozdział. Znajdź coś wyjątkowego albo puść dalej rzeczy, które już zrobiły swoje.</p><button onclick="go('add')">Wystaw rzecz ${ico('arrow',16)}</button> <button class="hero-link" onclick="go('auth')">Poznaj CLOVY <span>↗</span></button></div><div class="hero-mark"><div class="hero-stamp">PRE-LOVED<br><span>NOT REPLACED</span></div><div class="hero-note">LESS NEW.<br>MORE YOU.</div></div></div></section><div class="cats">${cats.map(c=>`<button class="cat ${activeCat===c?'active':''}" onclick="activeCat='${c}';renderHome()">${c==='Wszystko'?'✳ Wszystko':(c==='Ubrania'?'♧':c==='Buty'?'◒':'◇')+' '+c}</button>`).join('')}</div><div class="section-head"><h2>${activeCat==='Wszystko'?'Wybrane dla Ciebie':activeCat}</h2><span class="muted">${items.length} ${items.length===1?'ogłoszenie':'ogłoszeń'}</span></div><div class="notice" style="margin-bottom:16px">KATALOG DEMO / 250 PRZYKŁADOWYCH OFERT. Zdjęcia są ilustracyjne, a ogłoszenia fikcyjne.</div><section class="grid">${items.length?items.map(card).join(''):`<div class="empty"><div style="font-size:34px;margin-bottom:8px">✦</div><strong>Na razie pusto</strong><p>Dodaj pierwsze ogłoszenie albo zmień wyszukiwanie.</p><button onclick="go('add')">Dodaj ogłoszenie</button></div>`}</section></div>`}
function renderAuth(){page='auth';document.getElementById('app').innerHTML=`<div class="wrap page"><div class="panel loginbox"><h2>Dołącz do CLOVY</h2><p class="muted">Utwórz konto testowe lub zaloguj się na konto utworzone w tej przeglądarce.</p><div class="notice">Demo lokalne: konta nie mają prawdziwego zabezpieczenia hasłem ani serwera. Nie używaj prawdziwego hasła.</div><form id="authForm" onsubmit="authSubmit(event)"><div class="formgrid"><div class="field full"><label>Nazwa użytkownika</label><input id="authName" minlength="2" maxlength="30" required placeholder="np. ola_2008"></div><div class="field full"><label>Hasło testowe</label><input id="authPass" type="password" minlength="3" required placeholder="Dowolne hasło do demonstracji"></div></div><div class="actions"><button type="submit">Zaloguj / utwórz konto</button><button class="secondary" type="button" onclick="go('home')">Wróć</button></div></form><p class="authhint">Wpisanie nowej nazwy tworzy konto. Jeśli nazwa już istnieje, hasło testowe musi się zgadzać. Aby testować dwie osoby, zaloguj różne konta w dwóch kartach.</p></div></div>`}
function authSubmit(e){e.preventDefault();load();let name=document.getElementById('authName').value.trim(),pass=document.getElementById('authPass').value;if(name.length<2)return;let u=db.users.find(x=>x.name.toLowerCase()===name.toLowerCase());if(u){if(u.pass!==pass){say('Ta nazwa jest już zajęta — podaj właściwe hasło testowe.');return}}else{u={id:uid(),name,pass,joinedAt:Date.now(),bio:'',avatar:''};db.users.push(u)}current=u.id;save();updateHeader();say('Zalogowano jako '+u.name);go('home')}
function renderAdd(editId=null){page='add';if(!requireUser())return;let old=editId?db.items.find(i=>i.id===editId&&i.sellerId===current):null;if(editId&&!old){say('Nie możesz edytować tego ogłoszenia.');go('home');return}document.getElementById('app').innerHTML=`<div class="wrap page"><div class="panel"><h2>${old?'Edytuj ogłoszenie':'Wystaw przedmiot'}</h2><p class="muted">Dodaj szczegóły i zdjęcie produktu. W wersji demo zdjęcie zostaje zapisane lokalnie w tej przeglądarce.</p><form id="itemForm" onsubmit="submitItem(event,'${old?.id||''}')"><div class="formgrid"><div class="field full"><label>Tytuł ogłoszenia *</label><input id="itTitle" required maxlength="90" value="${esc(old?.title||'')}" placeholder="np. Bluza Nike oversize"></div><div class="field"><label>Cena (PLN) *</label><input id="itPrice" type="number" min="0.01" max="999999" step="0.01" required value="${old?.price??''}" placeholder="49.99"></div><div class="field"><label>Kategoria *</label><select id="itCat">${['Ubrania','Buty','Dodatki','Inne'].map(c=>`<option ${old?.category===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>Marka</label><input id="itBrand" maxlength="50" value="${esc(old?.brand||'')}" placeholder="np. Nike"></div><div class="field"><label>Rozmiar</label><input id="itSize" maxlength="20" value="${esc(old?.size||'')}" placeholder="np. M, 38, uniwersalny"></div><div class="field"><label>Stan</label><select id="itCondition">${['Nowy z metką','Nowy bez metki','Bardzo dobry','Dobry','Zadowalający'].map(c=>`<option ${old?.condition===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>Kolor</label><input id="itColor" maxlength="30" value="${esc(old?.color||'')}" placeholder="np. czarny"></div><div class="field full"><label>Opis *</label><textarea id="itDesc" required maxlength="1200" placeholder="Opisz produkt, jego stan i ewentualne wady...">${esc(old?.description||'')}</textarea></div><div class="field full"><label>Zdjęcie produktu (opcjonalne)</label><input id="itImage" type="file" accept="image/*" onchange="previewImage(event)"><div id="imagePreview">${old?.image?`<img src="${esc(old.image)}" style="max-width:180px;max-height:180px;border-radius:12px;object-fit:cover">`:''}</div><small class="muted">Dla lepszej wydajności zdjęcie zostanie zmniejszone. Limit około 2 MB po kompresji.</small></div></div><div class="actions"><button type="submit">${old?'Zapisz zmiany':'Opublikuj ogłoszenie'}</button><button type="button" class="secondary" onclick="go('${old?'myitems':'home'}')">Anuluj</button></div></form></div></div>`;window.pendingImage=old?.image||''}
function previewImage(e){let f=e.target.files?.[0];if(!f)return;if(!f.type.startsWith('image/')){say('Wybierz plik obrazu.');return}let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let scale=Math.min(1,1000/Math.max(im.width,im.height));let c=document.createElement('canvas');c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);window.pendingImage=c.toDataURL('image/jpeg',.78);document.getElementById('imagePreview').innerHTML=`<img src="${window.pendingImage}" style="max-width:180px;max-height:180px;border-radius:12px;object-fit:cover">`};im.src=r.result};r.readAsDataURL(f)}
function submitItem(e,id){e.preventDefault();if(!requireUser())return;load();let item={id:id||uid(),sellerId:current,title:document.getElementById('itTitle').value.trim(),price:Number(document.getElementById('itPrice').value),category:document.getElementById('itCat').value,brand:document.getElementById('itBrand').value.trim(),size:document.getElementById('itSize').value.trim(),condition:document.getElementById('itCondition').value,color:document.getElementById('itColor').value.trim(),description:document.getElementById('itDesc').value.trim(),image:window.pendingImage||'',status:'active',createdAt:Date.now()};if(!item.title||!item.description||!Number.isFinite(item.price)||item.price<=0){say('Sprawdź tytuł, opis i cenę.');return}let idx=db.items.findIndex(i=>i.id===id&&i.sellerId===current);if(idx>=0){item.createdAt=db.items[idx].createdAt;db.items[idx]=item}else db.items.push(item);save();say(idx>=0?'Zapisano zmiany':'Ogłoszenie opublikowane');go('myitems')}
function toggleLike(id){if(!requireUser())return;load();let idx=db.likes.findIndex(l=>l.userId===current&&l.itemId===id);if(idx>=0){db.likes.splice(idx,1);say('Usunięto z polubionych')}else{db.likes.push({userId:current,itemId:id,createdAt:Date.now()});let it=db.items.find(x=>x.id===id);if(it&&it.sellerId!==current)notify(it.sellerId,'like','Ktoś polubił Twój produkt',user()?.name+' polubił(a): '+it.title,id);say('Dodano do polubionych ♥')}save();refresh()}
function renderFavorites(){page='favorites';if(!requireUser())return;let items=db.items.filter(i=>db.likes.some(l=>l.userId===current&&l.itemId===i.id)&&i.status==='active');document.getElementById('app').innerHTML=`<div class="wrap page"><div class="section-head"><h2>Polubione</h2><span class="muted">${items.length} produktów</span></div><section class="grid">${items.length?items.map(card).join(''):`<div class="empty">Nie masz jeszcze polubionych produktów.<p>Przeglądaj oferty i kliknij serduszko, aby zapisać je tutaj.</p><button onclick="go('home')">Przeglądaj oferty</button></div>`}</section></div>`}
function renderMyItems(){page='myitems';if(!requireUser())return;let items=db.items.filter(i=>i.sellerId===current).sort((a,b)=>b.createdAt-a.createdAt);document.getElementById('app').innerHTML=`<div class="wrap page"><div class="section-head"><h2>Moje ogłoszenia</h2><button onclick="go('add')">＋ Dodaj przedmiot</button></div><div class="panel"><div class="tablelist">${items.length?items.map(i=>`<div class="listrow">${imageMarkup(i,'thumb')}<div class="grow"><strong>${esc(i.title)}</strong><p>${money(i.price)} · ${esc(i.category)} · <span class="badge">${i.status==='active'?'Aktywne':'Sprzedane'}</span></p></div><button class="secondary small" onclick="renderAdd('${i.id}')">Edytuj</button>${i.status==='active'?`<button class="small" onclick="markSold('${i.id}')">Sprzedane</button>`:`<button class="secondary small" onclick="relist('${i.id}')">Wznów</button>`}<button class="danger small" onclick="deleteItem('${i.id}')">Usuń</button></div>`).join(''):`<div class="empty">Nie masz jeszcze ogłoszeń.<p>Dodaj pierwszą rzecz, aby zobaczyć ją w marketplace.</p><button onclick="go('add')">Wystaw przedmiot</button></div>`}</div></div></div>`}
function markSold(id){load();let i=db.items.find(x=>x.id===id&&x.sellerId===current);if(!i)return;i.status='sold';save();say('Oznaczono jako sprzedane');renderMyItems()}
function relist(id){load();let i=db.items.find(x=>x.id===id&&x.sellerId===current);if(!i)return;i.status='active';save();renderMyItems()}
function deleteItem(id){if(!confirm('Na pewno usunąć ogłoszenie?'))return;load();let i=db.items.find(x=>x.id===id&&x.sellerId===current);if(!i)return;db.items=db.items.filter(x=>x.id!==id);db.likes=db.likes.filter(x=>x.itemId!==id);save();say('Usunięto ogłoszenie');renderMyItems()}
function detail(id){let i=db.items.find(x=>x.id===id);if(!i)return;let seller=db.users.find(u=>u.id===i.sellerId),liked=isLiked(id);document.getElementById('modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><button class="close" onclick="closeModal()">×</button><div class="detailgrid"><div>${imageMarkup(i,'detailphoto')}</div><div style="padding:8px 0"><div class="muted">${esc(i.category)} · ${esc(i.condition||'')}</div><h2 style="margin:8px 0">${esc(i.title)}</h2><div class="price" style="font-size:27px">${money(i.price)}</div><p>${esc(i.description).replace(/\n/g,'<br>')}</p><div class="muted" style="font-size:13px;line-height:1.9">${i.brand?'Marka: '+esc(i.brand)+'<br>':''}${i.size?'Rozmiar: '+esc(i.size)+'<br>':''}${i.color?'Kolor: '+esc(i.color)+'<br>':''}Dodano: ${new Date(i.createdAt).toLocaleDateString('pl-PL')}</div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><div class="profilehead"><span class="avatar big">${initials(seller?.name)}</span><div><strong>${esc(seller?.name||'Użytkownik')}</strong><div class="muted" style="font-size:12px">Sprzedający na CLOVY</div></div></div><div class="actions"><button onclick="toggleLike('${i.id}');detail('${i.id}')">${liked?'♥ Polubiono':'♡ Polub'}</button><button class="secondary" onclick="startChat('${i.sellerId}','${i.id}')">Napisz do sprzedającego</button>${i.sellerId!==current?`<button onclick="buyDemo('${i.id}')">Kup teraz (demo)</button>`:''}</div><p class="authhint">Przycisk zakupu tylko symuluje zamówienie — nie pobiera pieniędzy i nie organizuje wysyłki.</p></div></div></div></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function startChat(sellerId,itemId){if(!requireUser())return;if(sellerId===current){say('To Twoje ogłoszenie.');return}activeChat=[sellerId,itemId].join('|');closeModal();go('messages')}
function buyDemo(id){if(!requireUser())return;load();let i=db.items.find(x=>x.id===id);if(!i||i.status!=='active'){say('Ten produkt nie jest już dostępny.');return}if(i.sellerId===current){say('Nie możesz kupić własnego produktu.');return}db.orders.push({id:uid(),itemId:id,buyerId:current,sellerId:i.sellerId,price:i.price,status:'demo',createdAt:Date.now()});db.messages.push({id:uid(),from:current,to:i.sellerId,itemId:id,text:'Cześć! Jestem zainteresowany/a produktem „'+i.title+'”. (Zapytanie z demo)',createdAt:Date.now()});notify(i.sellerId,'order','Nowe zapytanie o produkt',user()?.name+' jest zainteresowany/a: '+i.title,id);save();closeModal();say('Utworzono testowe zamówienie — bez płatności.');go('orders')}
function renderOrders(){page='orders';if(!requireUser())return;let orders=db.orders.filter(o=>o.buyerId===current||o.sellerId===current).sort((a,b)=>b.createdAt-a.createdAt);document.getElementById('app').innerHTML=`<div class="wrap page"><h2>Testowe zamówienia</h2><div class="notice" style="margin-bottom:18px">To tylko demonstracja przepływu zakupowego. Nie są pobierane pieniądze, nie ma etykiet wysyłkowych ani ochrony kupującego.</div><div class="panel tablelist">${orders.length?orders.map(o=>{let i=db.items.find(x=>x.id===o.itemId),buyer=db.users.find(u=>u.id===o.buyerId),seller=db.users.find(u=>u.id===o.sellerId);return `<div class="listrow">${i?imageMarkup(i,'thumb'):'<div class="thumb">📦</div>'}<div class="grow"><strong>${esc(i?.title||'Usunięty produkt')}</strong><p>${money(o.price)} · ${o.buyerId===current?'Kupujesz':'Sprzedajesz'} · ${new Date(o.createdAt).toLocaleString('pl-PL')}</p><p>Kupujący: ${esc(buyer?.name||'')} · Sprzedawca: ${esc(seller?.name||'')}</p></div><span class="badge">DEMO</span></div>`}).join(''):'<div class="empty">Nie ma jeszcze zamówień testowych.</div>'}</div></div>`}
function renderMessages(){page='messages';if(!requireUser())return;let pairs=[];db.messages.forEach(m=>{if(m.from!==current&&m.to!==current)return;let other=m.from===current?m.to:m.from;let key=[other,m.itemId||''].join('|');if(!pairs.some(p=>p.key===key))pairs.push({key,other,itemId:m.itemId})});if(activeChat&&!pairs.some(p=>p.key===activeChat)){let [other,itemId]=activeChat.split('|');if(other&&other!==current)pairs.unshift({key:activeChat,other,itemId})}let selected=activeChat||pairs[0]?.key||'';activeChat=selected;let [otherId,itemId]=selected?selected.split('|'):['',''];let other=db.users.find(u=>u.id===otherId),it=db.items.find(i=>i.id===itemId);let msgs=db.messages.filter(m=>selected&&(m.itemId||'')===(itemId||'')&&((m.from===current&&m.to===otherId)||(m.from===otherId&&m.to===current))).sort((a,b)=>a.createdAt-b.createdAt);document.getElementById('app').innerHTML=`<div class="wrap page"><h2>Wiadomości</h2><div class="two"><div class="panel"><div class="tablelist">${pairs.length?pairs.map(p=>{let u=db.users.find(x=>x.id===p.other),item=db.items.find(x=>x.id===p.itemId);return `<div class="listrow" style="cursor:pointer" onclick="activeChat='${p.key}';renderMessages()"><span class="avatar">${initials(u?.name)}</span><div class="grow"><strong>${esc(u?.name||'Użytkownik')}</strong><p>${esc(item?.title||'Rozmowa')}</p></div>${selected===p.key?'<span class="badge">Wybrano</span>':''}</div>`}).join(''):'<div class="empty">Nie masz rozmów. Otwórz produkt i kliknij „Napisz do sprzedającego”.</div>'}</div></div><div class="chatbox"><div class="chathead">${other?esc(other.name):'Wybierz rozmowę'}${it?' · '+esc(it.title):''}</div><div class="messages" id="messagesPane">${msgs.map(m=>`<div class="bubble ${m.from===current?'mine':''}">${esc(m.text)}<div style="font-size:10px;color:#858b9a;margin-top:4px">${new Date(m.createdAt).toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'})}</div></div>`).join('')||'<div class="muted">Napisz pierwszą wiadomość.</div>'}</div><form class="sendrow" onsubmit="sendMessage(event,'${otherId}','${itemId||''}')"><input id="messageText" maxlength="1000" placeholder="Napisz wiadomość..." ${!otherId?'disabled':''} required><button ${!otherId?'disabled':''}>Wyślij</button></form></div></div></div>`;let pane=document.getElementById('messagesPane');if(pane)pane.scrollTop=pane.scrollHeight}
function sendMessage(e,to,itemId){e.preventDefault();if(!to||!requireUser())return;let textValue=document.getElementById('messageText').value.trim();if(!textValue)return;load();db.messages.push({id:uid(),from:current,to,itemId:itemId||'',text:textValue,createdAt:Date.now()});notify(to,'message','Nowa wiadomość od '+(user()?.name||'użytkownika'),textValue.slice(0,100),itemId||'');save();renderMessages()}
function renderProfile(){page='profile';if(!requireUser())return;let u=user(),items=db.items.filter(i=>i.sellerId===current&&i.status==='active'),sold=db.items.filter(i=>i.sellerId===current&&i.status==='sold');document.getElementById('app').innerHTML=`<div class="wrap page"><div class="panel"><div class="profilehead"><span class="avatar big">${initials(u.name)}</span><div class="grow"><h2 style="margin:0">${esc(u.name)}</h2><div class="muted">Członek CLOVY od ${new Date(u.joinedAt).toLocaleDateString('pl-PL')}</div></div><button class="secondary" onclick="logout()">Wyloguj</button></div><div class="field"><label>O mnie</label><textarea id="bio" maxlength="300" placeholder="Napisz kilka słów o sobie...">${esc(u.bio||'')}</textarea></div><div class="actions"><button onclick="saveBio()">Zapisz profil</button></div></div><div class="tabs"><button class="secondary" onclick="go('myitems')">Moje ogłoszenia (${items.length+sold.length})</button><button class="secondary" onclick="go('favorites')">Polubione</button><button class="secondary" onclick="go('messages')">Wiadomości</button><button class="secondary" onclick="go('orders')">Zamówienia demo</button></div><div class="section-head"><h2>Aktywne ogłoszenia</h2><button onclick="go('add')">＋ Dodaj</button></div><section class="grid">${items.length?items.map(card).join(''):'<div class="empty">Nie masz aktywnych ogłoszeń.</div>'}</section><div class="panel"><h3>Testowanie na dwóch kartach</h3><p class="muted">Otwórz ten sam plik w dwóch kartach tej samej przeglądarki. Zaloguj różne konta. Zmiany są zapisywane lokalnie i synchronizowane między kartami, jeśli przeglądarka udostępnia wspólny magazyn dla tego pliku.</p><div class="actions"><button class="secondary" onclick="exportData()">Eksportuj dane demo</button><button class="danger" onclick="resetData()">Usuń wszystkie dane demo</button></div></div></div>`}
function saveBio(){load();let u=user();if(!u)return;u.bio=document.getElementById('bio').value.trim();save();say('Zapisano opis profilu')}
function logout(){current=null;activeChat=null;updateHeader();say('Wylogowano');go('home')}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='clovy-demo-backup.json';a.click();URL.revokeObjectURL(a.href)}
function resetData(){if(!confirm('Usunąć wszystkie konta, ogłoszenia, polubienia, wiadomości i zamówienia zapisane w tej przeglądarce? Tej operacji nie można cofnąć.'))return;db=seed();current=null;save();seedDemoListings();load();go('home');say('Wyczyszczono dane demo i odtworzono katalog')}
load();seedDemoListings();load();updateHeader();renderHome();
</script>
</body>
</html>
